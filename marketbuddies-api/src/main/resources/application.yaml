spring:
  application:
    name: marketbuddies-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketbuddies}
    username: ${DB_USER:marketbuddies}
    password: ${DB_PASSWORD:marketbuddies}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

marketbuddies:
  admin:
    email: ${ADMIN_EMAIL:admin@marketbuddies.com}
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    from: ${MAIL_USERNAME:marketbuddies@exemplo.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  orders:
    expiration: 5m
    expiration-check-ms: 60000
  payment:
    # Regra do Tranquilo Bank, que agora roda dentro da API
    approval-limit: 500.00
    delay: 3s
  delivery:
    # Cada etapa da entrega dura pelo menos step; o job confere a cada check-ms
    step: 20s
    check-ms: 5000

app:
  jwt:
    secret: ${JWT_SECRET:marketbuddies-local-dev-secret-key-change-me-0123456789}
    expiration-ms: 3600000

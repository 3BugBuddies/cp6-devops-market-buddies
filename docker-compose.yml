# Banco local para desenvolvimento: PostgreSQL. A API roda pela IDE ou no profile "app":
#   docker compose up -d                          só o banco
#   docker compose --profile app up -d --build    banco + API em http://localhost:8080
# Na nuvem o banco é o Azure SQL (criado por scripts/infra-app.sh).

services:
  api:
    profiles: ["app"]
    build: ./marketbuddies-api
    container_name: cp6-marketbuddies-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marketbuddies
      DB_USER: marketbuddies
      DB_PASSWORD: marketbuddies
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: cp6-marketbuddies-postgres
    environment:
      POSTGRES_DB: marketbuddies
      POSTGRES_USER: marketbuddies
      POSTGRES_PASSWORD: marketbuddies
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketbuddies -d marketbuddies"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
